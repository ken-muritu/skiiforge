name: Nightly Reconcile

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
      uses: actions/checkout@v4

      - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

      - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run full remote sync
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        bash scripts/sync_remote.sh
        python3 scripts/build_inventory.py
        python3 scripts/validate_inventory.py

      - name: Freshness report
      run: |
        python3 - <<'PY'
        import json, pathlib, datetime
        idx = pathlib.Path("inventory/repos/index.json")
        data = json.loads(idx.read_text())
        now = datetime.datetime.utcnow().isoformat() + "Z"
        report = {
          "generated_at": now,
          "repo_count": data.get("generated_repo_count", 0),
          "failing_recent_runs_total": sum(p.get("failing_recent_runs", 0) for p in data.get("profiles", []))
        }
        pathlib.Path("findings/portfolio/drift-report.json").write_text(json.dumps(report, indent=2))
        print(json.dumps(report, indent=2))
        PY

      - name: Commit reconcile outputs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add inventory findings
        git diff --cached --quiet || git commit -m "chore(reconcile): nightly drift and inventory refresh"
        git push
