name: Nightly Reconcile

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
      uses: actions/checkout@v4

      - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

      - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run full remote sync
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SKIIFORGE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        SKIIFORGE_SCAN_SCOPE: reconcile
      run: |
        bash scripts/sync_remote.sh
        python3 scripts/collect_vercel_projects.py
        python3 scripts/build_inventory.py
        python3 scripts/verify_vercel_mappings.py
        python3 scripts/build_findings.py
        python3 scripts/generate_portfolio_reports.py
        python3 scripts/validate_inventory.py
        python3 scripts/emit_alerts.py

      - name: Create issue on alert
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ALERT_COUNT=$(python3 - <<'PY'
        import json
        with open("findings/portfolio/alerts.json","r",encoding="utf-8") as f:
            print(json.load(f).get("alert_count",0))
        PY
        )
        if [ "$ALERT_COUNT" -gt 0 ]; then
          gh issue create --title "Skiiforge reconcile alerts ($ALERT_COUNT)" --body-file findings/portfolio/alerts.md || true
        fi

      - name: Freshness report
      run: |
        python3 - <<'PY'
        import json, pathlib
        report = pathlib.Path("findings/portfolio/drift-report.json")
        data = json.loads(report.read_text())
        print(json.dumps(data, indent=2))
        PY

      - name: Commit reconcile outputs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add inventory findings frameworks schemas
        if git diff --cached --quiet; then
          exit 0
        fi
        RISK_CLASS=$(python3 scripts/classify_changes.py)
        echo "Change class: $RISK_CLASS"
        if [ "$RISK_CLASS" = "risk-impacting" ]; then
          echo "Risk-impacting change detected; manual approval required."
          exit 1
        fi
        git commit -m "chore(reconcile): nightly drift and inventory refresh"
        git push
